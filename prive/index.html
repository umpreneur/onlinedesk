<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Privé: niet opnemen in zoekmachines. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="google" content="notranslate">
  <meta name="theme-color" content="#F7F3EE">
  <title>OnlineDesk · Klantomgeving</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='13' fill='%234E6E5A'/%3E%3Ccircle cx='16.5' cy='17' r='8' fill='none' stroke='%23FFFDFA' stroke-width='3.4'/%3E%3Ccircle cx='31' cy='9' r='2.4' fill='%23DCC27E'/%3E%3Cpath d='M20.5 20.5 L33 25.4 L27.6 27.6 L25.4 33 Z' fill='%23E3A68B' stroke='%234E6E5A' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <!-- ===== Klantomgeving =====
       Privévoorstellen en klantdemo's, alleen met een toegangscode.
       Alles op dit toegangsscherm is zichtbaar voor iedereen; de inhoud zelf is versleuteld. -->
  <main id="lock" class="lock">
    <div class="blob blob-1" aria-hidden="true"></div>
    <div class="blob blob-2" aria-hidden="true"></div>
    <div class="blob blob-3" aria-hidden="true"></div>

    <div id="lock-lang" class="lock-lang"></div>

    <form id="lock-form" class="lock-card" autocomplete="off" novalidate>
      <div class="lock-logo" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="68" height="68"><rect width="40" height="40" rx="13" fill="#4E6E5A"/><circle cx="16.5" cy="17" r="8" fill="none" stroke="#FFFDFA" stroke-width="3.4"/><circle class="logo-spark" cx="31" cy="9" r="2.4" fill="#DCC27E"/><path class="logo-pointer" d="M20.5 20.5 L33 25.4 L27.6 27.6 L25.4 33 Z" fill="#E3A68B" stroke="#4E6E5A" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </div>
      <p class="eyebrow" data-i18n="eyebrow">Klantomgeving</p>
      <h1 class="lock-title">Online<span class="brand-accent">Desk</span></h1>
      <p class="lock-text" data-i18n="text">Hier vind je privévoorstellen en klantdemo's. Vul je persoonlijke toegangscode in om verder te gaan.</p>

      <label for="code" class="sr-only" data-i18n="label">Toegangscode</label>
      <div class="code-field">
        <input id="code" name="code" type="password" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="Bijv. ABCD-2345" required>
        <button type="button" class="eye" id="eye" aria-label="Code tonen" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <button class="btn btn-primary btn-block" type="submit" id="lock-btn">
        <span class="btn-label" data-i18n="open">Openen</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      <p class="lock-msg" id="lock-msg" role="status" aria-live="polite"></p>
      <p class="lock-foot"><span data-i18n="noCode">Geen code ontvangen?</span> <a href="../#contact" data-i18n="ask">Neem contact op</a></p>
    </form>
  </main>

  <!-- De inhoud wordt pas na een geldige code ontsleuteld en hier opgebouwd. -->
  <div id="app" hidden></div>

  <script src="../data/portfolio.js"></script>
  <script src="../assets/js/vault.js"></script>
  <script src="../assets/js/prive.js"></script>
</body>
</html>
